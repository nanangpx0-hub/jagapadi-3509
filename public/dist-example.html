    SCRIPTS - Use defer for non-blocking load

    -->
    
    <!-- 
        1. Vite build output naming convention:
           js/main-a1b2c3d4.js  (content hash for cache busting)
           js/dashboard-e5f6g7h8.js
           css/vendor-i9j0k1l2.css (vendor chunk)
       
        2. Include in HTML dengan defer attribute:
           - Script akan dieksekusi setelah HTML di-parse
           - Tidak memblokir FCP (First Contentful Paint)
           - Tidak Perlu menaruh di </body> (otomatis async)
    -->
    
    <!-- Base app events (Event Delegation System) - Loaded first -->
    <script defer src="/public/dist/js/app-events-a1b2c3d4.js"></script>
    
    <!-- Vendor chunk (Chart.js) - Can be cached longer -->
    <script defer src="/public/dist/js/vendor-e5f6g7h8.js"></script>
    
    <!-- Dashboard specific - Loaded on demand -->
    <script defer src="/public/dist/js/dashboard-i9j0k1l2.js"></script>
