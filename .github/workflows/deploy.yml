name: Deploy to Hosting

on:
  push:
    tags:
      - 'deploy-*'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (production)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, curl, gd, zip
          coverage: none

      - name: Install production dependencies (backend v1)
        run: composer install --no-dev --prefer-dist --no-interaction --working-dir=backend

      - name: Deploy via SSH
        env:
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          RELEASE_DIR: ${{ secrets.DEPLOY_RELEASE_DIR }}
        run: |
          install -m 600 /dev/null ~/deploy_key
          echo "$SSH_KEY" > ~/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          tar --exclude='.git' --exclude='node_modules' --exclude='tests' \
              --exclude='e2e' --exclude='backups' --exclude='.env*' \
              -czf /tmp/release.tar.gz .
          scp -P "${SSH_PORT:-22}" -i ~/deploy_key /tmp/release.tar.gz "$SSH_USER@$SSH_HOST:/tmp/"
          ssh -p "${SSH_PORT:-22}" -i ~/deploy_key "$SSH_USER@$SSH_HOST" bash -s <<'REMOTE'
            set -euo pipefail
            cd "$RELEASE_DIR"
            tar -xzf /tmp/release.tar.gz
            # .env TIDAK pernah ikut release — kelola manual di server.
            php backend/scripts/migrate.php || echo "migrate: periksa manual"
            php -l public/index.php >/dev/null
          REMOTE
          rm -f ~/deploy_key /tmp/release.tar.gz

      - name: Post-deploy smoke
        env:
          PROD_URL: ${{ secrets.DEPLOY_PROD_URL }}
        run: |
          curl -fsS -o /dev/null "${PROD_URL}/api/v1/health" && echo "health OK" || echo "PERIKSA MANUAL: /api/v1/health"
