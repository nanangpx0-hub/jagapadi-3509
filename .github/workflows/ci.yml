name: CI

on:
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  php-lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, mysqli, pdo_mysql

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --prefer-dist --no-progress
          else
            echo "composer.json tidak ditemukan, composer install dilewati."
          fi

      - name: PHP lint
        run: |
          find . -type f -name "*.php" \
            -not -path "./vendor/*" \
            -not -path "./storage/*" \
            -not -path "./node_modules/*" \
            -print0 | xargs -0 -n1 php -l

      - name: PHPUnit
        run: |
          if [ -f vendor/bin/phpunit ] && [ -f phpunit.xml.dist ]; then
            vendor/bin/phpunit --configuration phpunit.xml.dist
          elif [ -f vendor/bin/phpunit ] && [ -f phpunit.xml ]; then
            vendor/bin/phpunit --configuration phpunit.xml
          else
            echo "PHPUnit atau file konfigurasi PHPUnit tidak ditemukan, test dilewati."
          fi