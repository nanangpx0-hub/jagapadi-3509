  path: ^1.9.0
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5
  pdf: ^3.10.0
  printing: ^5.12.0
  share_plus: ^12.0.0
  path_provider: ^2.1.0
  crypto: ^3.0.3
  permission_handler: ^11.3.1
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  sqflite_common_ffi: ^2.3.3

flutter:
