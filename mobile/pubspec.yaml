name: jagapadi_mobile
description: JAGAPADI Mobile — Laporan pertanian untuk Kab. Jember
publish_to: 'none'
version: 1.1.3+6

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  provider: ^6.1.1
  go_router: ^14.0.0
  geolocator: ^11.0.0
  google_fonts: ^6.2.1
  image_picker: ^1.0.7
  intl: ^0.20.2
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  sqflite: ^2.3.0
