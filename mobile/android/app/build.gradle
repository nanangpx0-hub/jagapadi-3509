plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.jagapadi.app"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId "com.jagapadi.app"
        minSdk 24
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        debug {
            // Default debug keystore — dihasilkan otomatis oleh Android SDK
        }
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Gunakan release signing jika tersedia, fallback ke debug signing untuk CI/testing
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

// Validasi keystore hanya saat benar-benar menjalankan release task (bukan saat konfigurasi)
gradle.taskGraph.whenReady { taskGraph ->
    def isRelease = taskGraph.allTasks.any { task ->
        task.name.contains('assembleRelease') || task.name.contains('bundleRelease')
    }
    if (isRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException(
            "key.properties tidak ditemukan di android/.\n" +
            "Release build membutuhkan keystore. Jalankan:\n" +
            "  keytool -genkey -v -keystore android/jagapadi.jks -keyalg RSA -keysize 2048 -validity 10000 -alias jagapadi\n" +
            "Lalu buat android/key.properties dengan isi:\n" +
            "  storeFile=jagapadi.jks\n  storePassword=...\n  keyAlias=jagapadi\n  keyPassword=..."
        )
    }
}

flutter {
    source '../..'
}
